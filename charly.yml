version: 2026.240.1943
github-actions:
    candy:
        version: 2026.242.1330
        description: |
            Local GitHub Actions execution and workflow linting via act and actionlint.
            Installs the act CLI at /usr/bin/act for running GitHub Actions
            workflows locally, the actionlint linter at /usr/local/bin/actionlint
            for static workflow validation, and the guestfs-tools package. Each
            tool lands at a fixed path and self-reports a version, so its presence
            and basic operability are deterministically verifiable.
        package:
            - guestfs-tools
        var:
            # Pinned release tags — concrete tags, NOT `latest`, and the reason is
            # correctness rather than taste. The download verb content-addresses its cache by
            # sha256 OF THE URL. With `latest` the URL is constant while the artifact behind it
            # changes, so the cache would keep serving the first tarball it ever fetched.
            ACT_VERSION: 0.2.89
            ACTIONLINT_VERSION: 1.7.12
        plan:
            - run: install the pinned act CLI release tarball (var ACT_VERSION) — the declarative download verb keeps the content-addressed /tmp/downloads cache, the atomic .part to mv rename, and the stage-user-correct cache mount
              download: "https://github.com/nektos/act/releases/download/v${ACT_VERSION}/act_Linux_$(case ${BUILD_ARCH} in aarch64) echo arm64;; *) echo ${BUILD_ARCH};; esac).tar.gz"
              extract: tar.gz
              extract_include: [act]
              to: /usr/bin
              unless_exists: /usr/bin/act
              run_as: root
            - run: install the pinned actionlint release tarball (var ACTIONLINT_VERSION) — the declarative download verb keeps the content-addressed /tmp/downloads cache, the atomic .part to mv rename, and the stage-user-correct cache mount
              download: "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_${ARCH}.tar.gz"
              extract: tar.gz
              extract_include: [actionlint]
              to: /usr/local/bin
              unless_exists: /usr/local/bin/actionlint
              run_as: root
            - check: the act CLI is installed at its fixed path
              file:
                file: /usr/bin/act
                exists: true
            - check: act reports its version without error
              exit_status: 0
              command: /usr/bin/act --version
            - check: the actionlint linter is installed at its fixed path
              file:
                file: /usr/local/bin/actionlint
                exists: true
            - check: actionlint reports its version without error
              exit_status: 0
              command: /usr/local/bin/actionlint -version
            - check: package=guestfs-tools
              id: guestfs-tools-package
              package:
                package: guestfs-tools
                installed: true

github-actions-skill:
    skill:
        name: github-actions
        family: coder
        owner: github-actions
        description: |-
            GitHub Actions local runner (act-cli) and guestfs-tools via COPR.
            Use when working with GitHub Actions, local CI testing, or act.
        content: |-
            # github-actions -- Act CLI for local GitHub Actions
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml`, `task:` |
            
            ## Packages
            
            RPM (from COPR `goncalossilva/act`): `act-cli`, `guestfs-tools`
            
            ## Cross-distro coverage
            
            `rpm:` (Fedora), `pac:` (Arch). `deb:` (Debian/Ubuntu) — `act` and `actionlint` are curl-downloaded GitHub release binaries (distro-agnostic already); `guestfs-tools` is dropped from deb (not in Debian main). The candy's `task:` are format-agnostic so the per-distro divergence is minimal.
            
            ## Usage
            
            ```yaml
            # charly.yml
            my-ci:
              candy:
                - github-actions
            ```
            
            ## Used In Boxes
            
            - (none currently enabled)
            
            ## Related Candies
            - `/charly-distros:github-runner` — distinct self-hosted runner candy (not act)
            - `/charly-coder:docker-ce` — common companion for act workflow execution
            - `/charly-coder:dev-tools` — typically paired in CI boxes
            
            ## Related Commands
            - `/charly-build:build` — installs act-cli from COPR during image build
            - `/charly-core:shell` — run `act` interactively to test workflows locally
            
            ## When to Use This Skill
            
            Use when the user asks about:
            
            - Running GitHub Actions locally
            - The act CLI tool
            - The `github-actions` candy
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, task verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)
# download verb: see the pinned ACT_VERSION/ACTIONLINT_VERSION
